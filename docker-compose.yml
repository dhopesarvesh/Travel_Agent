version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: voyage_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: travel_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voyage_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:root@postgres:5432/travel_planner
      SECRET_KEY: dev-secret-change-me-in-production
      API_PREFIX: /api
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voyage_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
